# Ctrl+C is WezTerm's smart copy; with no text selected it reaches yazi as ^C, whose
# default (close the tab, i.e. quit) would kill the sidebar instead of copying.
# q and Q close the explorer through WezTerm (plugins/hivegrid.yazi) so the keyboard
# returns to the grid pane; a plain quit would leave it on the bar. T is the keyboard twin
# of a double click: a terminal in the hovered folder (a file's folder).
[mgr]
prepend_keymap = [
	{ on = "<C-c>", run = "copy path", desc = "Copy the path of the hovered or selected entries" },
	{ on = "q", run = "plugin hivegrid close", desc = "Close the explorer" },
	{ on = "Q", run = "plugin hivegrid close", desc = "Close the explorer" },
	{ on = "T", run = "plugin hivegrid open", desc = "Terminal in the hovered folder" },
]
