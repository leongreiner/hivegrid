# init.lua's double-click detection needs click events; dragging a column border
# (the rails between parent / current / preview) needs drag events; the resize cursor
# over a border needs move events.
[mgr]
mouse_events = [ "click", "scroll", "drag", "move" ]

# Empty files: plugins/hivegrid.yazi (a centred note, not yazi's reversed slab).
[plugin]
prepend_previewers = [
	{ mime = "inode/empty", run = "hivegrid" },
]
