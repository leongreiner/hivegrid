# Every job runs a step of dev/check, so `dev/check` locally runs exactly the same checks.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true" # dev/check: a missing tool fails its step instead of skipping it

jobs:
  python:
    name: Python (compile + unittest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No submodules: the checks need only config/, bin/, ext/ and tests/, not the WezTerm fork.
      - uses: actions/checkout@v4
        with:
          submodules: false
      - run: python3 --version
      - run: dev/check py

  lua:
    name: Lua (luac -p, tests, luacheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install lua5.4 and luacheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends lua5.4 lua-check
      - run: dev/check lua luacheck

  bun:
    name: omp extension (bun test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: oven-sh/setup-bun@v2
      - run: dev/check bun

  lint:
    name: shellcheck + actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.7
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install actionlint
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP" actionlint
          echo "ACTIONLINT=$RUNNER_TEMP/actionlint" >> "$GITHUB_ENV"
      - run: shellcheck --version
      - run: dev/check shell actions
