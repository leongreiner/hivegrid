# Publishes the pre-built Hivegrid WezTerm fork that install.sh downloads. Runs only when
# started by hand (Actions tab, "Run workflow", or `gh workflow run release.yml -f tag=v0.1.0`);
# no push, tag or schedule starts it.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  wezterm:
    name: Build and publish the WezTerm fork
    # Ubuntu 22.04 (glibc 2.35): the binary runs on that and anything newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the tag is free
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "tag must look like v1.2.3, got: $TAG" >&2; exit 1 ;; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake g++ pkg-config python3 xdg-utils \
            libegl1-mesa-dev libssl-dev libfontconfig1-dev libwayland-dev libx11-xcb-dev \
            libxcb-ewmh-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-render0-dev libxcb-shm0-dev libxcb-util-dev \
            libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev xorg-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wezterm
      - name: Build
        working-directory: wezterm
        run: cargo build --release -p wezterm-gui -p wezterm
      - name: Package
        run: dev/package-wezterm dist
      - name: Publish
        run: |
          fork=$(git -C wezterm rev-parse HEAD)
          gh release create "$TAG" dist/hivegrid-wezterm-x86_64-linux.tar.gz dist/hivegrid-wezterm-x86_64-linux.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Pre-built Hivegrid WezTerm for x86_64 Linux (glibc 2.35 or newer), fork commit \`$fork\`. \`install.sh\` downloads it; nothing here needs to be installed by hand."
